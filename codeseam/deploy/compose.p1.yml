# Only existing Sub2API dependencies. The Windows main service runs from this Fork.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeseam
      POSTGRES_DB: codeseam
      POSTGRES_PASSWORD: ${CODESEAM_DB_PASSWORD:?Set CODESEAM_DB_PASSWORD}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["./.local/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeseam -d codeseam"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
